name: veda-border

services:
  backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: veda-border-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - veda_case_data:/app/data/runtime
    environment:
      - PYTHONPATH=/app/services/api
      - MOCK_BORDER_INTELLIGENCE_ENABLED=true
      - THREAT_INTELLIGENCE_MANDATORY=true
      - VISUAL_FORENSICS_ENABLED=true
      - BIOMETRICS_ENABLED=true
      - FASTROUTER_ENABLED=false
      - CASE_DATABASE_PATH=data/runtime/veda_border.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: veda-border-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  veda_case_data:
